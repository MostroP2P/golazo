name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A deploy in flight is not cancelled: a half-published site is worse than a
# late one. Concurrent runs on other refs are.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: format
        run: npm run format:check

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      # SPEC 8.1: 100% for src/nostr and src/model, 80% overall.
      - name: unit and integration tests
        run: npm run test:coverage

      - name: build
        run: npm run build
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}

      # SPEC 7.5: 120 KB of gzipped JavaScript. Over budget does not deploy.
      - name: bundle budget
        run: npm run check:size

      - name: install the browser
        run: npx playwright install --with-deps chromium

      # Against the built site and a fake relay serving the real signed
      # fixtures, so a run says something about this commit, not a relay's day.
      # Tests the dist/ built above, served under the same base; Playwright
      # does not rebuild in CI, so the tested bytes are the published bytes.
      - name: end to end
        run: npm run test:e2e
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # The bytes that were tested are the bytes that get published.
      # `include-hidden-files` keeps `dist/.nojekyll`, without which Pages
      # drops the asset paths Vite emits.
      - name: package the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # SPEC 8.1: the same checks against the real relays. Informative, never a
  # deploy gate: relays have bad days that say nothing about a commit.
  live:
    name: live relays
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Playwright only previews in CI, so this runner builds its own site.
      - run: npm run build
      - run: npm run test:e2e:live
